# SPA server for the Vite build output.
# Listens on all IPv4/IPv6 interfaces so the port is reachable from outside
# the container once it is published (-p 8080:80 / compose `ports`).
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Docker's embedded DNS. Used with a variable in `proxy_pass` below so the
    # kroki container may be restarted (and get a new IP) without restarting
    # nginx: the name is re-resolved at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Everything the app needs is bundled; allow reasonably large adoc uploads
    # to be handled client-side (no server-side upload endpoint exists).
    client_max_body_size 10m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      font/woff2;

    # Basic hardening. Repeated in locations that define their own headers,
    # because nginx does not inherit add_header into such blocks.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Lightweight liveness endpoint used by HEALTHCHECK / orchestrators.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Kroki diagram renderer -------------------------------------------
    # Same-origin reverse proxy. Kroki is not published directly: it is only
    # reachable through this prefix. `/kroki/<path>` -> `kroki:8000/<path>`.
    #
    # `^~` is required: otherwise the regex static-file location below would
    # capture requests such as `/kroki/plantuml/svg` and return 404.
    location = /kroki {
        # Avoid an ambiguous prefix and broken relative links on the page.
        # Relative Location keeps the published port/host intact behind the
        # Docker port mapping (`http://localhost:8080/kroki/`, not `:80`).
        absolute_redirect off;
        return 301 /kroki/$is_args$args;
    }

    location ^~ /kroki/ {
        # Variable form forces runtime DNS resolution (see `resolver` above).
        set $kroki_upstream http://kroki:8000;
        rewrite ^/kroki/(.*)$ /$1 break;
        proxy_pass $kroki_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A diagram should never be huge. `plan.md` limits .puml files to
        # 256 KB in the app; 2 MB leaves room for inline sources.
        client_max_body_size 2m;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        # PlantUML can render noticeably longer than a static file request.
        proxy_read_timeout 30s;

        # Rendering is read-only: only GET/POST/HEAD/OPTIONS are allowed.
        limit_except GET POST HEAD OPTIONS {
            deny all;
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # Hashed Vite assets never change -> cache them forever.
    # `^~` keeps the regex block below from taking precedence over this prefix.
    location ^~ /assets/ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        access_log off;
    }

    # Other static files (favicon, icons, images).
    location ~* \.(?:svg|png|jpe?g|gif|webp|ico|woff2?)$ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        access_log off;
    }

    # index.html must always be revalidated so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # SPA fallback: unknown paths are handled by the client-side app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
