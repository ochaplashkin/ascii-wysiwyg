# SPA server for the Vite build output.
# Listens on all IPv4/IPv6 interfaces so the port is reachable from outside
# the container once it is published (-p 8080:80 / compose `ports`).
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Everything the app needs is bundled; allow reasonably large adoc uploads
    # to be handled client-side (no server-side upload endpoint exists).
    client_max_body_size 10m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      font/woff2;

    # Basic hardening. Repeated in locations that define their own headers,
    # because nginx does not inherit add_header into such blocks.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Lightweight liveness endpoint used by HEALTHCHECK / orchestrators.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed Vite assets never change -> cache them forever.
    # `^~` keeps the regex block below from taking precedence over this prefix.
    location ^~ /assets/ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        access_log off;
    }

    # Other static files (favicon, icons, images).
    location ~* \.(?:svg|png|jpe?g|gif|webp|ico|woff2?)$ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        access_log off;
    }

    # index.html must always be revalidated so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # SPA fallback: unknown paths are handled by the client-side app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
